name: Build and Push Images to Artifact Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  build-and-push:
    name: Build and push frontend and backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list
          gcloud config set project "${PROJECT_ID}"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Generate image names
        id: images
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/backend"
          FRONTEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/frontend"

          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --file Dockerfile.backend \
            --tag "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.version }}" \
            --tag "${{ steps.images.outputs.backend }}:latest" \
            .

      - name: Push backend image
        run: |
          docker push \
            "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.version }}"

          docker push \
            "${{ steps.images.outputs.backend }}:latest"

      - name: Build frontend image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.version }}" \
            --tag "${{ steps.images.outputs.frontend }}:latest" \
            .

      - name: Push frontend image
        run: |
          docker push \
            "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.version }}"

          docker push \
            "${{ steps.images.outputs.frontend }}:latest"

      - name: Show published images
        run: |
          echo "Backend image:"
          echo "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.version }}"

          echo "Frontend image:"
          echo "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.version }}"
  
      - name: Deploy backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: python-doc-backend
          region: ${{ env.REGION }}
          image: ${{ steps.images.outputs.backend }}:${{ steps.images.outputs.version }}
          env_vars: |-
            DATABASE_URL=sqlite:////tmp/documents.db
            UPLOAD_DIR=/tmp/uploads
          flags: >-
            --project=${{ env.PROJECT_ID }}
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --port=8000
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated
      
      - name: Verify backend Cloud Run revision
        shell: bash
        run: |
          SERVICE_JSON="$(
            gcloud run services describe python-doc-backend \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json
          )"

          READY="$(
            jq -r '
              .status.conditions[]
              | select(.type == "Ready")
              | .status
            ' <<< "${SERVICE_JSON}"
          )"

          CREATED_REVISION="$(
            jq -r '.status.latestCreatedRevisionName' \
              <<< "${SERVICE_JSON}"
          )"

          READY_REVISION="$(
            jq -r '.status.latestReadyRevisionName' \
              <<< "${SERVICE_JSON}"
          )"

          TRAFFIC_PERCENT="$(
            jq -r '.status.traffic[0].percent' \
              <<< "${SERVICE_JSON}"
          )"

          echo "Ready: ${READY}"
          echo "Created revision: ${CREATED_REVISION}"
          echo "Ready revision: ${READY_REVISION}"
          echo "Traffic: ${TRAFFIC_PERCENT}%"

          test "${READY}" = "True"
          test "${CREATED_REVISION}" = "${READY_REVISION}"
          test "${TRAFFIC_PERCENT}" = "100"
      - name: Normalize backend URL
        id: backend-url
        shell: bash
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          BACKEND_URL="${BACKEND_URL%/}"

          echo "url=${BACKEND_URL}" >> "${GITHUB_OUTPUT}"

      
      - name: Test backend public endpoint
        continue-on-error: true
        shell: bash
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          BACKEND_URL="${BACKEND_URL%/}"

          curl \
            --fail-with-body \
            --show-error \
            --location \
            "${BACKEND_URL}/healthz"

      
      - name: Deploy frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: python-doc-frontend
          region: ${{ env.REGION }}
          image: ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.version }}
          env_vars: |-
            BACKEND_URL=${{ steps.backend-url.outputs.url }}
          flags: >-
            --project=${{ env.PROJECT_ID }}
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --port=5000
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --ingress=all
            --no-invoker-iam-check

      - name: Verify frontend Cloud Run revision
        shell: bash
        run: |
          SERVICE_JSON="$(
            gcloud run services describe python-doc-frontend \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format=json
          )"

          READY="$(
            jq -r '
              .status.conditions[]
              | select(.type == "Ready")
              | .status
            ' <<< "${SERVICE_JSON}"
          )"

          CREATED_REVISION="$(
            jq -r '.status.latestCreatedRevisionName' \
              <<< "${SERVICE_JSON}"
          )"

          READY_REVISION="$(
            jq -r '.status.latestReadyRevisionName' \
              <<< "${SERVICE_JSON}"
          )"

          echo "Ready: ${READY}"
          echo "Created revision: ${CREATED_REVISION}"
          echo "Ready revision: ${READY_REVISION}"

          test "${READY}" = "True"
          test "${CREATED_REVISION}" = "${READY_REVISION}"

      - name: Show deployment summary
        shell: bash
        run: |
          echo "Backend image:"
          echo "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.version }}"

          echo "Frontend image:"
          echo "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.version }}"

          echo "Backend URL:"
          echo "${{ steps.deploy-backend.outputs.url }}"

          echo "Frontend URL:"
          echo "${{ steps.deploy-frontend.outputs.url }}"

          {
            echo "## Python Document Management deployment"
            echo ""
            echo "| Component | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.images.outputs.version }}\` |"
            echo "| Backend | ${{ steps.deploy-backend.outputs.url }} |"
            echo "| Frontend | ${{ steps.deploy-frontend.outputs.url }} |"
          } >> "${GITHUB_STEP_SUMMARY}"