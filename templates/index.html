{% extends "base.html" %}{% block title %}Documents{% endblock %}{% block content %}<h1>Documents</h1><form method="get"><input name="q" value="{{ q }}" placeholder="Search title or filename"><input name="category" value="{{ category }}" placeholder="Category"><button>Search</button></form><table><thead><tr><th>Title</th><th>Category</th><th>Filename</th><th>Size</th><th>Actions</th></tr></thead><tbody>{% for d in documents %}<tr><td>{{ d.title }}</td><td>{{ d.category }}</td><td>{{ d.filename }}</td><td>{{ d.size_bytes }} bytes</td><td><a href="{{ url_for('download',document_id=d.id) }}">Download</a><form class="inline" method="post" action="{{ url_for('delete',document_id=d.id) }}"><button onclick="return confirm('Delete this document?')">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No documents found.</td></tr>{% endfor %}</tbody></table>{% endblock %}
