<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Document Manager{% endblock %}</title><style>body{font-family:system-ui;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17202a}nav{display:flex;gap:1rem;margin-bottom:2rem}input,button,select{padding:.6rem;margin:.2rem}table{width:100%;border-collapse:collapse}th,td{padding:.7rem;border-bottom:1px solid #ddd;text-align:left}.flash{padding:.8rem;margin:.5rem 0;border-radius:.3rem;background:#eef}.danger{background:#fee}.success{background:#efe}.warning{background:#fff4cc}.inline{display:inline}</style></head><body><nav><strong>Document Manager</strong><a href="{{ url_for('index') }}">Documents</a><a href="{{ url_for('upload') }}">Upload</a></nav>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</body></html>
